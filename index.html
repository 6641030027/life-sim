<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5aa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>เกมจำลองชีวิต</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section class="start" id="start">
    <h1>ชื่อเกม</h1>
    <p class="tagline">เริ่มต้นชีวิตใหม่</p>
    <button class="big-btn" id="btnRandom"><i class="ti ti-dice-5" aria-hidden="true"></i>สุ่ม</button>
    <span class="hint">กดเพื่อสุ่มเพศ ชื่อ หน้าตา และครอบครัว</span>
  </section>

  <div class="game" id="game" hidden>
  <header class="top">
    <button class="icon-btn" id="btnMenu" aria-label="เมนู"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <h1 class="title">ชื่อเกม</h1>
    <button class="icon-btn" id="btnSettings" aria-label="ตั้งค่า"><i class="ti ti-settings" aria-hidden="true"></i></button>
  </header>

  <section class="char">
    <div class="figure" id="figure"></div>
    <div class="who">
      <div class="name"><span id="genderIcon" class="gender" role="img"></span><span id="charName"></span></div>
      <div class="sub" id="subline"></div>
    </div>
    <div class="money">
      <div class="amt" id="money">฿0</div>
      <div class="lbl">เงินส่วนตัว</div>
    </div>
  </section>

  <div class="body" id="body">
    <main class="log" id="log" aria-live="polite"></main>

    <nav class="nav" aria-label="เมนูหลัก">
      <button id="btnStage"><i class="ti ti-school" id="stageIcon" aria-hidden="true"></i><span id="stageLabel">วัยรุ่น</span></button>
      <button id="btnAssets"><i class="ti ti-wallet" aria-hidden="true"></i><span>ทรัพย์สิน</span></button>
      <button class="age-btn" id="btnAge" aria-label="เพิ่มอายุ"><i class="ti ti-plus" aria-hidden="true"></i><span>อายุ</span></button>
      <button id="btnRel"><i class="ti ti-heart" aria-hidden="true"></i><span>ความสัมพันธ์</span></button>
      <button id="btnAct"><i class="ti ti-dots-circle-horizontal" aria-hidden="true"></i><span>กิจกรรม</span></button>
    </nav>

    <section class="focus" aria-label="จุดเน้นของปี">
      <div class="focus-head"><b>จุดเน้นของปีนี้</b><span>เลื่อนดูตัวเลือกอื่น <i class="ti ti-arrows-horizontal" aria-hidden="true"></i></span></div>
      <div class="chips" id="chips"></div>
      <div class="focus-status" id="focusStatus"></div>
    </section>

    <section class="stats" id="stats" aria-label="สถานะ"></section>

    <button class="deep" id="btnDeep">
      <i class="ti ti-eye" aria-hidden="true"></i>
      <span class="grow">ข้อมูลเชิงลึก (ทักษะ ฯลฯ)</span>
      <i class="ti ti-chevron-up" aria-hidden="true"></i>
    </button>

    <div class="overlay modal" id="evOverlay" role="dialog" aria-modal="true" aria-labelledby="evTitle">
      <div class="card">
        <span class="badge">เหตุการณ์</span>
        <h2 id="evTitle"></h2>
        <p class="desc" id="evDesc"></p>
        <div id="evChoices"></div>
        <p class="note"><i class="ti ti-clock" aria-hidden="true"></i>บางผลจะโผล่หลังผ่านไปหลายปี</p>
      </div>
    </div>

    <div class="overlay panel" id="relOverlay" role="dialog" aria-modal="true" aria-label="ความสัมพันธ์">
      <div class="panel-head">
        <button class="icon-btn" id="relClose" aria-label="ปิด"><i class="ti ti-x" aria-hidden="true"></i></button>
        <h2>ความสัมพันธ์</h2>
        <span class="spacer"></span>
      </div>
      <div class="panel-scroll" id="relList"></div>
    </div>

    <div class="overlay sheet-wrap" id="sheetOverlay">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <h2 id="sheetTitle"></h2>
          <button class="icon-btn" id="sheetClose" aria-label="ปิด"><i class="ti ti-x" aria-hidden="true"></i></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
